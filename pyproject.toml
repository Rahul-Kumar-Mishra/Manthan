[project]
name = "manthan"
version = "0.1.0"
description = "Healthcare operations API"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.13,<2",
    "aiosqlite>=0.20,<1",
    "email-validator>=2,<3",
    "fastapi>=0.115,<1",
    "PyJWT>=2.9,<3",
    "pwdlib[argon2]>=0.2,<1",
    "psycopg[binary]>=3.2,<4",
    "pydantic-settings>=2.5,<3",
    "redis>=5,<7",
    "sqlalchemy[asyncio]>=2.0,<3",
    "uvicorn[standard]>=0.30,<1",
]

[dependency-groups]
dev = [
    "httpx>=0.27,<1",
    "pytest>=8,<9",
    "pytest-asyncio>=0.24,<1",
    "ruff>=0.6,<1",
    "ty>=0.0.89",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
