services:
  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://manthan:local_dev_password@postgres:5432/manthan
      SECRET_KEY: ${SECRET_KEY:-local-compose-only-change-me}
    command:
      - sh
      - -c
      - alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
  postgres:
    image: postgres:17-alpine
    container_name: manthan-postgres
    environment:
      POSTGRES_DB: manthan
      POSTGRES_USER: manthan
      POSTGRES_PASSWORD: local_dev_password
    volumes:
      - manthan-postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U manthan -d manthan"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  manthan-postgres-data: